spring.application.name=nous

# ── Neon DB (PostgreSQL) ────────────────────────────────────────────────────
# Set NEON_DB_URL in your environment or .env file — never hardcode credentials.
# Format: jdbc:postgresql://<host>/<dbname>?sslmode=require
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon requires SSL; HikariCP tuning for serverless cold-start
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate = crash fast if schema doesn't match; use 'update' only in dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── App-specific config ──────────────────────────────────────────────────────
# Local upload directory (absolute path or relative to working dir)
app.upload.dir=${UPLOAD_DIR:./uploads}

# Max file size in bytes enforced at service level (5 MB)
app.upload.max-size-bytes=5242880

# Allowed MIME types (comma-separated)
app.upload.allowed-mime-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document

# Extracted text preview length returned in API responses
app.upload.text-preview-length=50000

# ── ClamAV (optional — NoOp scanner active when false) ───────────────────────
app.clamav.enabled=false
app.clamav.host=localhost
app.clamav.port=3310
app.clamav.timeout-ms=5000

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.project.nous=INFO
# Never log extracted resume text at DEBUG to avoid PII in logs
logging.level.com.project.nous.service.TextExtractionService=WARN

# ── LLM Role Intelligence (Phase 3) ─────────────────────────────────────────
app.llm.enabled=true
app.llm.provider=${LLM_PROVIDER:openai}
app.llm.api-key=${LLM_API_KEY:mock-key}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.timeout-ms=20000
app.llm.max-retries=2

