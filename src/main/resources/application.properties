spring.application.name=nous

# ── Neon DB (PostgreSQL) ────────────────────────────────────────────────────
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon requires SSL; HikariCP tuning for high concurrency
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── App-specific config ──────────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-size-bytes=5242880
app.upload.allowed-mime-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document
app.upload.text-preview-length=50000

# ── ClamAV ───────────────────────────────────────────────────────────────────
app.clamav.enabled=false
app.clamav.host=localhost
app.clamav.port=3310
app.clamav.timeout-ms=5000

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.project.nous=INFO
logging.level.com.project.nous.service.TextExtractionService=WARN

# ── LLM Role Intelligence ────────────────────────────────────────────────────
app.llm.enabled=true
app.llm.provider=${LLM_PROVIDER:openai}
app.llm.api-key=${LLM_API_KEY:mock-key}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.llm.timeout-ms=20000
app.llm.max-retries=2

# ── Live Job Search API Provider ─────────────────────────────────────────────
app.jobapi.enabled=${JOB_API_ENABLED:true}
app.jobapi.provider=${JOB_API_PROVIDER:top500}
app.jobapi.country=${JOB_API_COUNTRY:in}
app.jobapi.timeout-ms=5000
